sonar.projectKey=EuMesmoMatheus_vea-frontend
sonar.organization=eumesmomatheus

# Nome que aparece no SonarCloud
sonar.projectName=vea-frontend

# Encoding e linguagem
sonar.sources=.
sonar.exclusions=**/node_modules/**, **/dist/**, **/build/**, coverage/**, **/*.test.js, **/*.spec.js
sonar.sourceEncoding=UTF-8

# Se você usa Jest + coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js, **/*.spec.js, src/tests/**