<div class="login-container">
  <c-card class="login-card">
    <c-card-header class="text-center">VEA - Login</c-card-header>
    <c-card-body>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <c-input-group class="mb-3" [class.input-invalid]="submitted && loginForm.controls.email.errors">
          <c-input-group-text><i class="c-icon cil-envelope-closed"></i></c-input-group-text>
          <input cFormControl placeholder="E-mail" formControlName="email" type="email">
          <span class="error-message" *ngIf="submitted && loginForm.controls.email.errors.required">E-mail obrigatório</span>
          <span class="error-message" *ngIf="submitted && loginForm.controls.email.errors.email">E-mail inválido</span>
        </c-input-group>
        <c-input-group class="mb-3" [class.input-invalid]="submitted && loginForm.controls.password.errors">
          <c-input-group-text><i class="c-icon cil-lock-locked"></i></c-input-group-text>
          <input cFormControl placeholder="Senha" formControlName="password" type="password">
          <span class="error-message" *ngIf="submitted && loginForm.controls.password.errors.required">Senha obrigatória</span>
        </c-input-group>
        <button cButton color="primary" type="submit" class="w-100">Entrar</button>
        <p class="error-message" *ngIf="error">{{ error }}</p>
      </form>
      <p class="text-center mt-3"><a routerLink="/register">Cadastrar-se</a></p>
    </c-card-body>
  </c-card>
</div>
