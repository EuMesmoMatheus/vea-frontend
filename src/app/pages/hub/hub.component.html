<div class="hub-container">
  <mat-card class="hub-card">
    <mat-card-header>
      <mat-card-title class="text-center">Hub Empresarial</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Filtrar por localização</mat-label>
        <input matInput [(ngModel)]="filterLocation" (input)="filter()">
      </mat-form-field>
      <p class="error-message" *ngIf="error">{{ error }}</p>
      <mat-table [dataSource]="companies">
        <ng-container matColumnDef="name">
          <mat-header-cell *matHeaderCellDef> Nome </mat-header-cell>
          <mat-cell *matCellDef="let company"> {{ company.name }} </mat-cell>
        </ng-container>
        <ng-container matColumnDef="location">
          <mat-header-cell *matHeaderCellDef> Localização </mat-header-cell>
          <mat-cell *matCellDef="let company"> {{ company.location }} </mat-cell>
        </ng-container>
        <ng-container matColumnDef="phone">
          <mat-header-cell *matHeaderCellDef> Telefone </mat-header-cell>
          <mat-cell *matCellDef="let company"> {{ company.phone }} </mat-cell>
        </ng-container>
        <ng-container matColumnDef="actions">
          <mat-header-cell *matHeaderCellDef> Ações </mat-header-cell>
          <mat-cell *matCellDef="let company"> <button mat-raised-button color="primary">Agendar</button> </mat-cell>
        </ng-container>
        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
      </mat-table>
    </mat-card-content>
  </mat-card>
</div>
