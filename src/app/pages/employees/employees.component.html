<div class="employees-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title class="text-center">Gerenciar Funcionários</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <button mat-raised-button color="primary" class="mb-3">Adicionar Funcionário</button>
      <p class="error-message" *ngIf="error">{{ error }}</p>
      <mat-table [dataSource]="employees">
        <ng-container matColumnDef="name">
          <mat-header-cell *matHeaderCellDef> Nome </mat-header-cell>
          <mat-cell *matCellDef="let employee"> {{ employee.name }} </mat-cell>
        </ng-container>
        <ng-container matColumnDef="email">
          <mat-header-cell *matHeaderCellDef> E-mail </mat-header-cell>
          <mat-cell *matCellDef="let employee"> {{ employee.email }} </mat-cell>
        </ng-container>
        <ng-container matColumnDef="role">
          <mat-header-cell *matHeaderCellDef> Cargo </mat-header-cell>
          <mat-cell *matCellDef="let employee"> {{ employee.role }} </mat-cell>
        </ng-container>
        <ng-container matColumnDef="actions">
          <mat-header-cell *matHeaderCellDef> Ações </mat-header-cell>
          <mat-cell *matCellDef="let employee">
            <button mat-raised-button color="warn">Editar</button>
            <button mat-raised-button color="accent" (click)="delete(employee.id)">Excluir</button>
          </mat-cell>
        </ng-container>
        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
      </mat-table>
    </mat-card-content>
  </mat-card>
</div>
