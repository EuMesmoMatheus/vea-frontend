<div class="appointments-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title class="text-center">Agendamentos</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="error-message" *ngIf="error">{{ error }}</p>
      <mat-table [dataSource]="appointments">
        <ng-container matColumnDef="dateTime">
          <mat-header-cell *matHeaderCellDef> Data/Hora </mat-header-cell>
          <mat-cell *matCellDef="let appointment"> {{ appointment.dateTime | date:'medium' }} </mat-cell>
        </ng-container>
        <ng-container matColumnDef="status">
          <mat-header-cell *matHeaderCellDef> Status </mat-header-cell>
          <mat-cell *matCellDef="let appointment" [ngClass]="{'confirmed': appointment.status === 'Confirmed', 'cancelled': appointment.status === 'Cancelled'}"> {{ appointment.status }} </mat-cell>
        </ng-container>
        <ng-container matColumnDef="actions">
          <mat-header-cell *matHeaderCellDef> Ações </mat-header-cell>
          <mat-cell *matCellDef="let appointment">
            <button mat-raised-button color="warn" (click)="cancel(appointment.id)" *ngIf="appointment.status !== 'Cancelled'">Cancelar</button>
          </mat-cell>
        </ng-container>
        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
      </mat-table>
    </mat-card-content>
  </mat-card>
</div>
