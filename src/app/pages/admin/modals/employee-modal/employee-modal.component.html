<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl p-8 w-full max-w-md mx-4 animate-fade-in">
    <h3 class="text-xl font-semibold mb-6">
      {{ editingId ? 'Editar' : 'Adicionar' }} Funcionário
      <span *ngIf="loading" class="ml-2 text-sm text-gray-500">(Carregando...)</span>
    </h3>
    <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="empName" class="block text-sm font-medium text-gray-700 mb-2">Nome Completo *</label>
        <input id="empName" formControlName="name" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-pink-500" [class.border-red-300]="submittedEmployee && employeeForm.get('name')?.invalid">
        <small *ngIf="submittedEmployee && employeeForm.get('name')?.errors?.['required']" class="text-red-500 text-xs">Nome obrigatório</small>
      </div>
      <div>
        <label for="empEmail" class="block text-sm font-medium text-gray-700 mb-2">E-mail *</label>
        <input id="empEmail" formControlName="email" type="email" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-pink-500" [class.border-red-300]="submittedEmployee && employeeForm.get('email')?.invalid">
        <small *ngIf="submittedEmployee && employeeForm.get('email')?.errors?.['required']" class="text-red-500 text-xs">E-mail obrigatório</small>
        <small *ngIf="submittedEmployee && employeeForm.get('email')?.errors?.['email']" class="text-red-500 text-xs">E-mail inválido</small>
      </div>
      <div>
        <label for="empPhone" class="block text-sm font-medium text-gray-700 mb-2">Telefone (opcional)</label>
        <input id="empPhone" formControlName="phone" type="tel" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-pink-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Foto do Funcionário (opcional)</label>
        <div class="space-y-3">
          <div class="flex items-center space-x-4">
            <img [src]="photoPreview || currentPhotoUrl || 'assets/default-avatar.png'" alt="Foto" class="h-20 w-20 rounded-full object-cover border border-gray-200 shadow-md">
            <div class="flex-1">
              <input #empPhotoFile type="file" (change)="onEmployeePhotoChange($event)" accept="image/*" class="hidden">
              <button type="button" (click)="empPhotoFile.click()" class="px-4 py-2 bg-pink-500 text-white rounded-xl hover:bg-pink-600 transition-all text-sm">
                Alterar Foto
              </button>
            </div>
          </div>
          <small *ngIf="employeePhotoError" class="text-red-500 text-xs">{{ employeePhotoError }}</small>
        </div>
      </div>
      <div>
        <label for="empRoleId" class="block text-sm font-medium text-gray-700 mb-2">Cargo *</label>
        <select id="empRoleId" formControlName="roleId" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-pink-500" [class.border-red-300]="submittedEmployee && employeeForm.get('roleId')?.invalid">
          <option value="">Selecione um cargo</option>
          <option *ngFor="let role of roles" [value]="role.id">{{ role.name }}</option>
        </select>
        <small *ngIf="submittedEmployee && employeeForm.get('roleId')?.errors?.['required']" class="text-red-500 text-xs">Cargo obrigatório</small>
      </div>
      <div class="flex justify-end space-x-4 pt-6">
        <button type="button" (click)="close.emit()" class="px-6 py-2 text-gray-600 rounded-xl hover:bg-gray-100 transition-all duration-300">Cancelar</button>
        <button type="submit" [disabled]="employeeForm.invalid || loading" class="px-6 py-2 bg-pink-500 text-white rounded-xl hover:bg-pink-600 transition-all duration-300 disabled:opacity-50">Salvar</button>
      </div>
    </form>
  </div>
</div>
