<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl p-8 w-full max-w-md mx-4 animate-fade-in">
    <h3 class="text-xl font-semibold mb-6">{{ editingId ? 'Editar' : 'Adicionar' }} Serviço</h3>
    <form [formGroup]="serviceForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="srvName" class="block text-sm font-medium text-gray-700 mb-2">Nome do Serviço *</label>
        <input id="srvName" formControlName="name" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-pink-500" [class.border-red-300]="submittedService && serviceForm.get('name')?.invalid">
        <small *ngIf="submittedService && serviceForm.get('name')?.errors?.['required']" class="text-red-500 text-xs">Nome obrigatório</small>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="srvHours" class="block text-sm font-medium text-gray-700 mb-2">Horas *</label>
          <input id="srvHours" formControlName="hours" type="number" min="0" max="24" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-pink-500 text-sm" [class.border-red-300]="submittedService && serviceForm.get('hours')?.invalid">
          <small *ngIf="submittedService && serviceForm.get('hours')?.errors?.['required']" class="text-red-500 text-xs">Horas obrigatórias (0-24)</small>
        </div>
        <div>
          <label for="srvMinutes" class="block text-sm font-medium text-gray-700 mb-2">Minutos *</label>
          <input id="srvMinutes" formControlName="minutes" type="number" min="0" max="59" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-pink-500 text-sm" [class.border-red-300]="submittedService && serviceForm.get('minutes')?.invalid">
          <small *ngIf="submittedService && serviceForm.get('minutes')?.errors?.['required']" class="text-red-500 text-xs">Minutos obrigatórios (0-59)</small>
        </div>
      </div>
      <div>
        <label for="srvPrice" class="block text-sm font-medium text-gray-700 mb-2">Preço (R$) *</label>
        <input id="srvPrice" formControlName="price" type="text" (input)="formatPrice($event)" (blur)="parsePrice()" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-pink-500" [class.border-red-300]="submittedService && serviceForm.get('price')?.invalid" placeholder="0,00">
        <small *ngIf="submittedService && serviceForm.get('price')?.errors?.['required']" class="text-red-500 text-xs">Preço obrigatório</small>
        <small *ngIf="submittedService && serviceForm.get('price')?.errors?.['min']" class="text-red-500 text-xs">Preço mínimo R$ 0</small>
        <small class="text-gray-500 text-xs mt-1 block">Ex: 99,90</small>
      </div>
      <div>
        <label class="flex items-center text-sm font-medium text-gray-700 mb-2">
          <input type="checkbox" formControlName="active" class="mr-2 rounded">
          Ativo
        </label>
        <small class="text-gray-500 text-xs">Serviços inativos não aparecem no hub de agendamentos</small>
      </div>
      <div class="flex justify-end space-x-4 pt-6">
        <button type="button" (click)="close.emit()" class="px-6 py-2 text-gray-600 rounded-xl hover:bg-gray-100 transition-all duration-300">Cancelar</button>
        <button type="submit" [disabled]="serviceForm.invalid" class="px-6 py-2 bg-pink-500 text-white rounded-xl hover:bg-pink-600 transition-all duration-300 disabled:opacity-50">Salvar</button>
      </div>
    </form>
  </div>
</div>
