<div class="dashboard-container">
  <c-row>
    <c-col xs="12" md="4">
      <c-card class="metric-card">
        <c-card-header>Funcionários</c-card-header>
        <c-card-body class="text-center">
          <h1>{{ employeesCount }}</h1>
          <a routerLink="/employees" cButton color="secondary">Gerenciar</a>
        </c-card-body>
      </c-card>
    </c-col>
    <c-col xs="12" md="4">
      <c-card class="metric-card">
        <c-card-header>Serviços</c-card-header>
        <c-card-body class="text-center">
          <h1>{{ servicesCount }}</h1>
          <a routerLink="/services" cButton color="secondary">Gerenciar</a>
        </c-card-body>
      </c-card>
    </c-col>
    <c-col xs="12" md="4">
      <c-card class="metric-card">
        <c-card-header>Agendamentos</c-card-header>
        <c-card-body class="text-center">
          <h1>{{ appointmentsCount }}</h1>
          <a routerLink="/appointments" cButton color="secondary">Ver</a>
        </c-card-body>
      </c-card>
    </c-col>
  </c-row>
  <c-card>
    <c-card-header>Gráfico de Agendamentos</c-card-header>
    <c-card-body>
      <canvas id="chart" class="chart"></canvas> <!-- Adicione ng-chartjs para gráficos reais -->
    </c-card-body>
  </c-card>
</div>
