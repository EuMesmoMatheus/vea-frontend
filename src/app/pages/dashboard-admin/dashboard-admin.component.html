<div class="dashboard-container">
  <div class="metric-row">
    <mat-card class="metric-card">
      <mat-card-header>Funcionários</mat-card-header>
      <mat-card-content class="text-center">
        <h1>{{ employeesCount }}</h1>
        <a routerLink="/employees" mat-raised-button color="primary">Gerenciar</a>
      </mat-card-content>
    </mat-card>
    <mat-card class="metric-card">
      <mat-card-header>Serviços</mat-card-header>
      <mat-card-content class="text-center">
        <h1>{{ servicesCount }}</h1>
        <a routerLink="/services" mat-raised-button color="primary">Gerenciar</a>
      </mat-card-content>
    </mat-card>
    <mat-card class="metric-card">
      <mat-card-header>Agendamentos</mat-card-header>
      <mat-card-content class="text-center">
        <h1>{{ appointmentsCount }}</h1>
        <a routerLink="/appointments" mat-raised-button color="primary">Ver</a>
      </mat-card-content>
    </mat-card>
  </div>
  <mat-card>
    <mat-card-header>Gráfico de Agendamentos</mat-card-header>
    <mat-card-content>
      <canvas id="chart" class="chart"></canvas> // Adicione Chart.js para gráficos reais
    </mat-card-content>
  </mat-card>
</div>
