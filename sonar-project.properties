# ====================================
# VEA Frontend - SonarCloud Configuration
# ====================================

# Identificação do projeto
sonar.projectKey=EuMesmoMatheus_vea-frontend
sonar.organization=eumesmomatheus
sonar.projectName=VEA Frontend
sonar.projectVersion=1.0.0

# ====================================
# Configurações de Fonte
# ====================================
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Exclusões de análise
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/test/**,\
  **/environments/**,\
  **/*.d.ts,\
  **/main.ts,\
  **/polyfills.ts,\
  **/assets/**

# ====================================
# Configurações de Testes
# ====================================
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# ====================================
# Cobertura de Código
# ====================================
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusões de cobertura
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/test/**,\
  **/environments/**,\
  **/main.ts,\
  **/*.module.ts,\
  **/*.routes.ts,\
  **/app.config.ts,\
  **/*.d.ts

# ====================================
# Análise de TypeScript/Angular
# ====================================
sonar.typescript.tsconfigPath=tsconfig.json

# ====================================
# Qualidade de Código - Quality Gate
# ====================================
# Duplicação de código
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts

# ====================================
# Regras de Segurança (OWASP)
# ====================================
# Habilita regras de segurança específicas
sonar.security.hotspots.confidentiality=HIGH
sonar.security.hotspots.integrity=HIGH

# ====================================
# Análise Incremental
# ====================================
sonar.scm.provider=git
sonar.scm.forceReloadAll=false

# ====================================
# Links do Projeto
# ====================================
sonar.links.homepage=https://github.com/EuMesmoMatheus/vea-frontend
sonar.links.ci=https://github.com/EuMesmoMatheus/vea-frontend/actions
sonar.links.issue=https://github.com/EuMesmoMatheus/vea-frontend/issues
sonar.links.scm=https://github.com/EuMesmoMatheus/vea-frontend

