name: CI/CD + SonarCloud Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================
  # Job 1: Lint e Validações
  # ============================================
  lint:
    name: 🔍 Lint & Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint || true
        continue-on-error: true

      - name: Security audit
        run: npm audit --production || true
        continue-on-error: true

  # ============================================
  # Job 2: Testes + Cobertura
  # ============================================
  test:
    name: 🧪 Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npm run test:ci || true
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ============================================
  # Job 3: Build
  # ============================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build project (development)
        run: npm run build -- --configuration development

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ============================================
  # Job 4: SonarCloud Analysis
  # ============================================
  sonarcloud:
    name: 📊 SonarCloud Scan
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history para análise de código

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npm run test:ci || true
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=EuMesmoMatheus_vea-frontend
            -Dsonar.organization=eumesmomatheus
            -Dsonar.projectName=VEA Frontend
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/environments/**
            -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/test/**
            -Dsonar.sourceEncoding=UTF-8

  # ============================================
  # Job 5: Notificação (opcional)
  # ============================================
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [build, sonarcloud]
    if: always()
    steps:
      - name: Check job status
        run: |
          echo "Build status: ${{ needs.build.result }}"
          echo "SonarCloud status: ${{ needs.sonarcloud.result }}"
          
          if [[ "${{ needs.build.result }}" == "failure" ]] || [[ "${{ needs.sonarcloud.result }}" == "failure" ]]; then
            echo "⚠️ Pipeline completed with warnings"
          else
            echo "✅ Pipeline completed successfully"
          fi
